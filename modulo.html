
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ardiansyah - 262505020 - Aritmetika Modular</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f5ef;
            color: #39463e;
            padding: 30px 15px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #526b5b;
        }

        .deskripsi {
            text-align: center;
            color: #7b857d;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 22px;
            border: 1px solid #e1e6dd;
            box-shadow: 0 4px 12px #39463e0b;
        }

        h2 {
            font-size: 20px;
            color: #526b5b;
            margin-top: 0;
        }

        label {
            display: block;
            margin: 14px 0 7px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5ddd3;
            border-radius: 9px;
            background: #fafbf8;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 18px;
            border: none;
            border-radius: 9px;
            background: #8ca995;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #718f7a;
        }

        .lavender {
            background: #a39bc5;
        }

        .lavender:hover {
            background: #8980ae;
        }

        .hasil {
            background: #edf3ec;
            padding: 15px;
            border-radius: 10px;
            margin-top: 18px;
            overflow-wrap: anywhere;
            line-height: 1.6;
        }

        .hasil strong {
            font-size: 21px;
            color: #526b5b;
        }

        .kongruen {
            background: #edf5ed;
            border: 1px solid #c9dfca;
        }

        .tidak {
            background: #f8eeee;
            border: 1px solid #ebcccc;
        }

        .penjelasan {
            text-align: left;
            border-top: 1px solid #d5ddd3;
            margin-top: 15px;
            padding-top: 10px;
        }

        .penjelasan h3 {
            color: #526b5b;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #899188;
            margin-top: 25px;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Aritmetika Modular</h1>
    <p class="deskripsi">
        Kalkulator Modulo dan Pengecek Kongruensi
    </p>

    <!-- KALKULATOR MODULAR -->
    <div class="card">
        <h2>01. Kalkulator Modular</h2>
        <p>Cari sisa hasil pembagian dua bilangan.</p>

        <label for="angka">Bilangan</label>
        <input type="number" id="angka" placeholder="Contoh: 17">

        <label for="modulus">Pembagi (n)</label>
        <input type="number" id="modulus" placeholder="Contoh: 5">

        <button onclick="hitungModular()">Hitung Mod</button>

        <div class="hasil" id="hasilMod">
            Hasil: -
        </div>
    </div>

    <!-- PENGECEK KONGRUENSI -->
    <div class="card">
        <h2>02. Pengecek Kongruensi</h2>
        <p>Cek apakah dua bilangan kongruen modulo n.</p>

        <label for="bilanganA">Bilangan A</label>
        <input type="number" id="bilanganA" placeholder="Contoh: 17">

        <label for="bilanganB">Bilangan B</label>
        <input type="number" id="bilanganB" placeholder="Contoh: 7">

        <label for="modN">Modulus (n)</label>
        <input type="number" id="modN" placeholder="Contoh: 5">

        <button class="lavender" onclick="cekKongruensi()">
            Cek Kongruensi
        </button>

        <!-- PENJELASAN MUNCUL DI BAWAH TOMBOL -->
        <div class="hasil" id="hasilKongruensi">
            Hasil dan penjelasan akan muncul di sini.
        </div>
    </div>

    <footer>
        Matematika Informasi | Aritmetika Modular
    </footer>

</div>

<script>
    // KALKULATOR MODULAR
    function hitungModular() {
        let a = document.getElementById("angka").value;
        let n = Number(document.getElementById("modulus").value);
        let output = document.getElementById("hasilMod");

        if (a.trim() === "" ||
            document.getElementById("modulus").value === "" ||
            !Number.isFinite(Number(a)) ||
            !Number.isFinite(n) || n <= 0) {
            output.innerHTML =
                "Masukkan bilangan dan pembagi positif yang valid!";
            return;
        }

        a = Number(a);
        let hasil = ((a % n) + n) % n;

        output.innerHTML = `
            <strong>${a} mod ${n} = ${hasil}</strong>
            <div class="penjelasan">
                <b>Penjelasan:</b>
                <p>${a} dibagi ${n} menghasilkan sisa ${hasil}.</p>
            </div>
        `;
    }

    // PENGECEK KONGRUENSI
    function cekKongruensi() {
        let inputA = document.getElementById("bilanganA").value;
        let inputB = document.getElementById("bilanganB").value;
        let inputN = document.getElementById("modN").value;
        let output = document.getElementById("hasilKongruensi");

        if (inputA.trim() === "" ||
            inputB.trim() === "" ||
            inputN.trim() === "" ||
            !Number.isFinite(Number(inputA)) ||
            !Number.isFinite(Number(inputB)) ||
            !Number.isFinite(Number(inputN)) ||
            Number(inputN) <= 0) {
            output.className = "hasil";
            output.innerHTML =
                "Masukkan dua bilangan dan modulus positif yang valid!";
            return;
        }

        let a = Number(inputA);
        let b = Number(inputB);
        let n = Number(inputN);

        let sisaA = ((a % n) + n) % n;
        let sisaB = ((b % n) + n) % n;

        let bagiA = Math.floor(a / n);
        let bagiB = Math.floor(b / n);

        if (sisaA === sisaB) {
            output.className = "hasil kongruen";

            output.innerHTML = `
                <h2 style="color:#39734d">✅ BENAR</h2>

                <strong>${a} ≡ ${b} (mod ${n})</strong>

                <div class="penjelasan">
                    <h3>Penjelasan Perhitungan</h3>

                    <p><b>Langkah 1: Hitung sisa A.</b></p>
                    <p>${a} = (${bagiA} × ${n}) + ${sisaA}</p>
                    <p>Sisa pembagian ${a} adalah ${sisaA}.</p>

                    <p><b>Langkah 2: Hitung sisa B.</b></p>
                    <p>${b} = (${bagiB} × ${n}) + ${sisaB}</p>
                    <p>Sisa pembagian ${b} adalah ${sisaB}.</p>

                    <p><b>Langkah 3: Bandingkan kedua sisa.</b></p>
                    <p>${sisaA} = ${sisaB}</p>

                    <p>
                        <b>Kesimpulan:</b> Kedua sisa pembagian sama.
                        Jadi, ${a} dan ${b} kongruen modulo ${n}.
                        Pernyataan tersebut BENAR.
                    </p>
                </div>
            `;
        } else {
            output.className = "hasil tidak";

            output.innerHTML = `
                <h2 style="color:#b34444">❌ SALAH</h2>

                <strong>${a} ≢ ${b} (mod ${n})</strong>

                <div class="penjelasan">
                    <h3>Penjelasan Perhitungan</h3>

                    <p><b>Langkah 1: Hitung sisa A.</b></p>
                    <p>${a} = (${bagiA} × ${n}) + ${sisaA}</p>
                    <p>Sisa pembagian ${a} adalah ${sisaA}.</p>

                    <p><b>Langkah 2: Hitung sisa B.</b></p>
                    <p>${b} = (${bagiB} × ${n}) + ${sisaB}</p>
                    <p>Sisa pembagian ${b} adalah ${sisaB}.</p>

                    <p><b>Langkah 3: Bandingkan kedua sisa.</b></p>
                    <p>${sisaA} ≠ ${sisaB}</p>

                    <p>
                        <b>Kesimpulan:</b> Kedua sisa pembagian berbeda.
                        Jadi, ${a} dan ${b} tidak kongruen modulo ${n}.
                        Pernyataan tersebut SALAH.
                    </p>
                </div>
            `;
        }
    }
</script>

</body>
</html>
